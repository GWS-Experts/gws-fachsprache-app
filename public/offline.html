<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b2f63">
<title>Keine Verbindung – GWS Fachsprache</title>
<style>
  body { margin: 0; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px;
         background: #f5f7fa; color: #1c2733; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; }
  main { max-width: 360px; background: #fff; border: 1px solid #dbe2ea; border-radius: 12px; padding: 28px 24px; }
  img { width: 96px; height: 96px; }
  h1 { color: #0b2f63; font-size: 1.25rem; margin: 16px 0 8px; }
  p { color: #5b6878; line-height: 1.5; margin: 0 0 8px; }
  button { margin-top: 16px; background: #0b2f63; color: #fff; border: 0; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 600; }
</style>
</head>
<body>
<main>
  <img src="/gws-logo.png" alt="GWS">
  <h1>Keine Internetverbindung</h1>
  <p>Die Trainings-App braucht Internet, um Lektionen zu laden und deinen Fortschritt zu speichern.</p>
  <p lang="en">No internet connection. Please try again when you are back online.</p>
  <button onclick="location.reload()">Erneut versuchen</button>
</main>
</body>
</html>
